[project]
name = "odyssey"
version = "1.0.0"
description = "Odyssey: The Compleat Apventure (Synergistic Software, 1980) - a Python port"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pygame-ce>=2.4"]

[project.scripts]
odyssey = "odyssey.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["odyssey"]
